name: Check Sub2API Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Sub2API databases
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            for pg in sub2api2-postgres sub2api-postgres; do
              if ! docker inspect "${pg}" >/dev/null 2>&1; then
                echo "=== ${pg}: missing ==="
                continue
              fi

              echo "=== ${pg} ==="
              user="$(docker exec "${pg}" printenv POSTGRES_USER)"
              db="$(docker exec "${pg}" printenv POSTGRES_DB)"
              docker exec "${pg}" psql -U "${user}" -d "${db}" -Atc "select 'users=' || count(*) from users;"
              docker exec "${pg}" psql -U "${user}" -d "${db}" -Atc "select 'api_keys=' || count(*) from api_keys;" || true
              docker exec "${pg}" psql -U "${user}" -d "${db}" -Atc "select 'accounts=' || count(*) from accounts;" || true
              docker exec "${pg}" psql -U "${user}" -d "${db}" -Atc "select 'groups=' || count(*) from groups;" || true
            done

            echo "=== running sub2api containers ==="
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}' | sed -n '1p;/sub2api/p'
