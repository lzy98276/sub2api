name: Recover Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Recover on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/sub2api}"
            cd "${DEPLOY_PATH}"

            port="$(grep -E '^SERVER_PORT=' .env 2>/dev/null | tail -n1 | cut -d= -f2 || true)"
            port="${port:-8080}"

            echo "Current Docker containers:"
            docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}\t{{.Status}}' || true

            conflicts="$(docker ps -q --filter "publish=${port}" || true)"
            if [ -n "${conflicts}" ]; then
              echo "Removing Docker containers currently publishing port ${port}: ${conflicts}"
              docker rm -f ${conflicts}
            fi

            docker rm -f sub2api sub2api-postgres sub2api-redis 2>/dev/null || true

            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env up -d
              docker compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env ps
            else
              docker-compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env up -d
              docker-compose -f docker-compose.yml -f docker-compose.ci.yml --env-file .env ps
            fi

            curl -fsS "http://127.0.0.1:${port}/health"
