name: Sync upstream sub2api

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Merge upstream without replacing marketplace code
        env:
          UPSTREAM_REPOSITORY: https://github.com/Wei-Shaw/sub2api.git
        run: |
          # Keep only the two fork features: the homepage and model marketplace.
          # The marketplace also needs its route, navigation, translations, API,
          # and server endpoint to remain functional after an upstream sync.
          is_fork_owned_path() {
            case "$1" in
              .github/workflows/sync-upstream.yml | \
              backend/internal/handler/available_channel_handler.go | \
              backend/internal/handler/available_channel_handler_test.go | \
              backend/internal/server/routes/user.go | \
              backend/internal/service/channel.go | \
              backend/internal/service/channel_available.go | \
              frontend/src/api/modelMarketplace.ts | \
              frontend/src/components/layout/AppSidebar.vue | \
              frontend/src/i18n/locales/en.ts | \
              frontend/src/i18n/locales/zh.ts | \
              frontend/src/router/index.ts | \
              frontend/src/views/HomeView.vue | \
              frontend/src/views/user/ModelMarketplaceView.vue)
                return 0
                ;;
            esac
            return 1
          }

          git remote add upstream "$UPSTREAM_REPOSITORY" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch upstream main
          if ! git merge --no-ff --no-commit upstream/main; then
            if git ls-files --unmerged | grep -q .; then
              while IFS= read -r path; do
                if is_fork_owned_path "$path"; then
                  git checkout --ours -- "$path"
                else
                  git checkout --theirs -- "$path"
                fi
              done < <(git diff --name-only --diff-filter=U)
              git add -A
            else
              echo "Upstream merge failed before conflicts could be resolved."
              exit 1
            fi
          fi

          # Restore the fork files after a clean merge as well: Git only reports
          # conflicts for overlapping paths, while files unique to this fork still
          # need to survive a future upstream deletion.
          git restore --source=HEAD --staged --worktree -- \
            .github/workflows/sync-upstream.yml \
            backend/internal/handler/available_channel_handler.go \
            backend/internal/handler/available_channel_handler_test.go \
            backend/internal/server/routes/user.go \
            backend/internal/service/channel.go \
            backend/internal/service/channel_available.go \
            frontend/src/api/modelMarketplace.ts \
            frontend/src/components/layout/AppSidebar.vue \
            frontend/src/i18n/locales/en.ts \
            frontend/src/i18n/locales/zh.ts \
            frontend/src/router/index.ts \
            frontend/src/views/HomeView.vue \
            frontend/src/views/user/ModelMarketplaceView.vue

          if git diff --cached --quiet; then
            echo "Upstream is already synchronized."
            exit 0
          fi

          corepack enable
          pushd frontend
          pnpm install --frozen-lockfile
          pnpm run build
          popd

          git commit -m "chore: sync upstream sub2api"
          git push origin HEAD:main
